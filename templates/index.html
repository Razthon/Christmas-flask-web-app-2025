<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Claim your Christmas Gift!</title>

    <style>
        .captcha-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .captcha-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .captcha-item img {
            width: 150px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .captcha-item img.selected {
            border-color: green;
        }
    </style>
</head>

<body>
    <h1>Merry Christmas!</h1>
    <p>Select <strong>ALL</strong> images of ZELDA</p>

    <form method="post" action="/verify" autocomplete="off">
        <div class="captcha-container">
            {% for img in images %}
                <div class="captcha-item">
                    <img src="{{ url_for('static', filename='captcha/' + img) }}">
                    <label>
                        <input type="checkbox" name="choice" value="{{ img }}">
                        Select
                    </label>
                </div>
            {% endfor %}
        </div>

        <br>
        <button type="submit">Verify</button>
    </form>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll("input[type=checkbox]").forEach(cb => cb.checked = false);
        });

        document.querySelectorAll(".captcha-item").forEach(item => {
            const img = item.querySelector("img");
            const checkbox = item.querySelector("input");

            img.addEventListener("click", () => {
                checkbox.checked = !checkbox.checked;
                img.classList.toggle("selected", checkbox.checked);
            });
        });
    </script>
</body>
</html>
