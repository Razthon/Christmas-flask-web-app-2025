<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Required</title>
</head>
<body>
    <h1>🔐 Use the password to authenticate</h1>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        <input type="password" name="password" required>
        <br><br>
        <button type="submit">Continue</button>
    </form>
</body>
</html>
